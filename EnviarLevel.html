<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Um Nível - LPDM/LIDM List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 450px; padding: 28px; margin-top: 40px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    input { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; }
    button { background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    a { color: #8493a8; text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    <h2>Enviar Nível para Análise</h2>
    <form id="levelForm">
      <div class="form-group">
        <label>Nome do Nível</label>
        <input type="text" id="levelName" required>
      </div>
      <div class="form-group">
        <label>Criador</label>
        <input type="text" id="levelCreator" required>
      </div>
      <div class="form-group">
        <label>Link do Vídeo (YouTube/Vídeo de prova)</label>
        <input type="url" id="videoUrl" required>
      </div>
      <button type="submit" id="btnSubmit">Enviar Nível</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('levelForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("Você precisa estar logado para enviar um nível!");
        window.location.href = "CadastroLogin.html";
        return;
      }

      const name = document.getElementById('levelName').value;
      const creator = document.getElementById('levelCreator').value;
      const videoUrl = document.getElementById('videoUrl').value;
      const btn = document.getElementById('btnSubmit');

      btn.textContent = "Enviando...";
      btn.disabled = true;

      const { error } = await supabaseClient.from('levels').insert({
        name: name,
        creator: creator,
        video_url: videoUrl,
        submitted_by: session.user.id
      });

      if (error) {
        alert("Erro ao enviar: " + error.message);
      } else {
        alert("Nível enviado com sucesso! Ele aguardará a aprovação de um moderador.");
        this.reset();
      }

      btn.textContent = "Enviar Nível";
      btn.disabled = false;
    });
  </script>
</body>
</html>
