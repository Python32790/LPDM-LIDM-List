<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Nível - LPDM/LIDM List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 500px; padding: 28px; margin-top: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    input, select { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.95rem; width: 100%; }
    input[type="file"] { padding: 8px; cursor: pointer; }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    button { background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; }
    .btn-verify { background: #1e293b; border: 1px solid var(--card-border); color: #3b82f6; padding: 8px; margin-top: 4px; font-size: 0.85rem; }
    a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
    .api-status { font-size: 0.8rem; margin-top: 4px; font-weight: bold; }
    .api-success { color: #22c55e; }
    .api-error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Enviar Nível para a Lista</h2>
    
    <form id="levelForm" style="margin-top: 15px;">
      <div class="form-group">
        <label>ID do Nível no Geometry Dash</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="gdId" required placeholder="Ex: 12345678">
          <button type="button" class="btn-verify" id="btnCheckGd" style="width: auto; white-space: nowrap;">Validar ID</button>
        </div>
        <div id="gdStatus" class="api-status"></div>
      </div>

      <div class="form-group">
        <label>Nome do Nível</label>
        <input type="text" id="levelName" required placeholder="Ex: Bloodlust">
      </div>

      <div class="form-group">
        <label>Criador(es)</label>
        <input type="text" id="levelCreator" required placeholder="Ex: Manix645 & more">
      </div>

      <div class="form-group">
        <label>Verificador</label>
        <input type="text" id="levelVerifier" required placeholder="Ex: Knobbelboy ou ???">
      </div>

      <div class="form-group">
        <label>Lista Destino</label>
        <select id="listType" required>
          <option value="LPDM">LPDM ( Levels Possíveis Dedicados ao Meow )</option>
          <option value="LIDM">LIDM ( Levels Impossíveis Dedicados ao Meow )</option>
        </select>
      </div>

      <div class="form-group">
        <label>Link da Showcase / Vídeo</label>
        <input type="text" id="videoUrl" placeholder="Cole o link do vídeo de prova aqui">
      </div>

      <div class="form-group">
        <label>Arquivo da Thumbnail / Imagem</label>
        <input type="file" id="thumbnailFile" accept="image/*" required>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="hasNong" onchange="toggleNongInput()">
        <label for="hasNong" style="color: #fff; cursor: pointer;">Este nível possui música NONG?</label>
      </div>

      <div class="form-group" id="nongGroup" style="display: none;">
        <label>Nome da Música NONG</label>
        <input type="text" id="nongName" placeholder="Ex: Creo - Sphere (NONG Mix)">
      </div>

      <button type="submit" id="btnSubmit"><i class="fa-solid fa-paper-plane"></i> Enviar Nível</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleNongInput() {
      const checked = document.getElementById('hasNong').checked;
      const nongGroup = document.getElementById('nongGroup');
      const nongInput = document.getElementById('nongName');

      nongGroup.style.display = checked ? 'flex' : 'none';
      
      if (checked) {
        nongInput.setAttribute('required', 'required');
      } else {
        nongInput.removeAttribute('required');
        nongInput.value = '';
      }
    }

    document.getElementById('btnCheckGd').addEventListener('click', async () => {
      const gdId = document.getElementById('gdId').value.trim();
      const statusDiv = document.getElementById('gdStatus');

      if (!gdId) {
        statusDiv.className = "api-status api-error";
        statusDiv.textContent = "Digite um ID válido.";
        return;
      }

      statusDiv.className = "api-status";
      statusDiv.textContent = "Buscando dados no Geometry Dash...";

      try {
        const response = await fetch(`https://gdbrowser.com/api/level/${gdId}`);
        if (!response.ok) throw new Error("Nível não encontrado no GD!");

        const data = await response.json();

        document.getElementById('levelName').value = data.name;
        document.getElementById('levelCreator').value = data.author;

        statusDiv.className = "api-success api-status";
        statusDiv.textContent = `✓ Nível encontrado: "${data.name}" por ${data.author}`;
      } catch (err) {
        statusDiv.className = "api-status api-error";
        statusDiv.textContent = "✗ ID não encontrado no Geometry Dash.";
      }
    });

    document.getElementById('levelForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        alert("Você precisa estar logado para enviar um nível!");
        window.location.href = "CadastroLogin.html";
        return;
      }

      const gdId = document.getElementById('gdId').value.trim();
      const name = document.getElementById('levelName').value.trim();
      const creator = document.getElementById('levelCreator').value.trim();
      const verifier = document.getElementById('levelVerifier').value.trim();
      const listType = document.getElementById('listType').value;
      const videoUrl = document.getElementById('videoUrl').value.trim();
      const thumbnailFileInput = document.getElementById('thumbnailFile');
      const hasNong = document.getElementById('hasNong').checked;
      const nongName = document.getElementById('nongName').value.trim();
      const btn = document.getElementById('btnSubmit');

      const file = thumbnailFileInput.files[0];
      if (!file) {
        alert("Por favor, selecione uma imagem para a thumbnail.");
        return;
      }

      btn.textContent = "Enviando imagem e dados...";
      btn.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `level_thumbnails/${fileName}`;

        const { error: uploadError } = await supabaseClient.storage
          .from('thumbnails')
          .upload(filePath, file);

        if (uploadError) throw uploadError;

        const { data: { publicUrl } } = supabaseClient.storage
          .from('thumbnails')
          .getPublicUrl(filePath);

        const { error: dbError } = await supabaseClient.from('levels').insert({
          gd_id: gdId,
          name: name,
          creator: creator,
          verifier: verifier,
          list_type: listType,
          video_url: videoUrl,
          thumbnail_url: publicUrl,
          has_nong: hasNong,
          nong_name: hasNong ? nongName : null,
          submitted_by: session.user.id
        });

        if (dbError) throw dbError;

        alert("Nível enviado com sucesso! Aguarde a verificação dos moderadores.");
        this.reset();
        document.getElementById('gdStatus').textContent = "";
        toggleNongInput();

      } catch (err) {
        alert("Erro no envio: " + err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Nível';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
