<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPDM/LIDM List - Ranking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
    .navbar { width: 100%; background-color: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-radius: 8px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; text-decoration: none; color: var(--text-main); }
    .container { max-width: 850px; margin: 0 auto; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .level-thumb { width: 100px; height: 60px; object-fit: cover; border-radius: 6px; background: #0b111e; }
    .rank-num { font-size: 1.6rem; font-weight: 800; color: var(--accent-blue); min-width: 45px; text-align: center; }
    .level-info h3 { font-size: 1.2rem; }
    .level-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .badge-nong { background: #8b5cf6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-top: 4px; }
    .btn-video { color: var(--accent-blue); text-decoration: none; font-size: 1.3rem; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Lista Oficial</h2>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tabLPDM" onclick="switchTab('LPDM')">LPDM (Demon List)</button>
      <button class="tab-btn" id="tabLIDM" onclick="switchTab('LIDM')">LIDM (Impossible List)</button>
    </div>

    <div id="levelsContainer">Carregando níveis...</div>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentList = 'LPDM';

    function switchTab(type) {
      currentList = type;
      document.getElementById('tabLPDM').classList.toggle('active', type === 'LPDM');
      document.getElementById('tabLIDM').classList.toggle('active', type === 'LIDM');
      loadRanking();
    }

    async function loadRanking() {
      const container = document.getElementById('levelsContainer');
      container.innerHTML = "Carregando...";

      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .eq('status', 'approved')
        .eq('list_type', currentList)
        .order('position', { ascending: true });

      container.innerHTML = "";

      if (error || !levels || levels.length === 0) {
        container.innerHTML = `<p style='text-align:center; color: #8493a8;'>Nenhum nível aprovado na lista ${currentList} ainda.</p>`;
        return;
      }

      levels.forEach(lvl => {
        const card = document.createElement('div');
        card.className = 'level-card';
        
        const thumbHtml = lvl.thumbnail_url 
          ? `<img src="${lvl.thumbnail_url}" class="level-thumb" alt="Thumbnail">` 
          : `<div class="level-thumb" style="display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-image" style="color:#8493a8"></i></div>`;

        const nongHtml = lvl.has_nong 
          ? `<div class="badge-nong"><i class="fa-solid fa-music"></i> NONG: ${lvl.nong_name || 'Sim'}</div>` 
          : '';

        card.innerHTML = `
          <div style="display:flex; align-items:center; gap: 15px;">
            <span class="rank-num">#${lvl.position}</span>
            ${thumbHtml}
            <div class="level-info">
              <h3>${lvl.name} <small style="font-size:0.8rem; color:#8493a8;">(ID: ${lvl.gd_id})</small></h3>
              <p>Criado por: <b>${lvl.creator}</b> | Verificador: <b>${lvl.verifier || '???'}</b></p>
              ${nongHtml}
            </div>
          </div>
          <a href="${lvl.video_url}" target="_blank" class="btn-video" title="Ver Showcase"><i class="fa-solid fa-circle-play"></i></a>
        `;
        container.appendChild(card);
      });
    }

    loadRanking();
  </script>
</body>
</html>
