<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas de Níveis - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
    .navbar { width: 100%; background-color: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-radius: 8px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; text-decoration: none; color: var(--text-main); }
    .container { max-width: 800px; margin: 0 auto; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 120px; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .level-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .level-info p { color: var(--text-muted); font-size: 0.9rem; }
    .thumb { width: 130px; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid var(--card-border); }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Meow List - Listas</h2>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tabLPDM" onclick="switchList('LPDM')">LPDM</button>
      <button class="tab-btn" id="tabLIDM" onclick="switchList('LIDM')">LIDM</button>
      <button class="tab-btn" id="tabLLBDM" onclick="switchList('LLBDM')">LLBDM</button>
    </div>

    <div id="levelsContainer">Carregando níveis...</div>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentList = 'LPDM';

    function switchList(listType) {
      currentList = listType;
      ['LPDM', 'LIDM', 'LLBDM'].forEach(type => {
        document.getElementById(`tab${type}`).classList.toggle('active', type === listType);
      });
      loadApprovedLevels();
    }

    async function loadApprovedLevels() {
      const container = document.getElementById('levelsContainer');
      container.innerHTML = "Carregando...";

      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .eq('status', 'approved')
        .eq('list_type', currentList)
        .order('position', { ascending: true });

      container.innerHTML = "";

      if (error || !levels || levels.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px;">Nenhum nível aprovado nesta lista ainda.</p>`;
        return;
      }

      levels.forEach(lvl => {
        const card = document.createElement('div');
        card.className = 'level-card';
        card.innerHTML = `
          <div class="level-info">
            <h3>#${lvl.position} - ${lvl.name}</h3>
            <p>ID: <b>${lvl.gd_id}</b> | Criador: <b>${lvl.creator}</b> | Verificador: <b>${lvl.verifier}</b></p>
            ${lvl.has_nong ? `<p style="color: #a855f7; font-size: 0.85rem; margin-top:4px;"><b>NONG:</b> ${lvl.nong_name}</p>` : ''}
            ${lvl.video_url ? `<a href="${lvl.video_url}" target="_blank" style="color: var(--accent-blue); font-size: 0.85rem; text-decoration:none; display:inline-block; margin-top:6px;"><i class="fa-solid fa-up-right-from-square"></i> Ver Showcase</a>` : ''}
          </div>
          ${lvl.thumbnail_url ? `<img src="${lvl.thumbnail_url}" class="thumb">` : ''}
        `;
        container.appendChild(card);
      });
    }

    loadApprovedLevels();
  </script>
</body>
</html>
