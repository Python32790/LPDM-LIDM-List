<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPDM/LIDM List - Ranking</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
    .navbar { width: 100%; background-color: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; text-decoration: none; color: var(--text-main); }
    .container { max-width: 800px; margin: 0 auto; }
    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .rank-num { font-size: 1.5rem; font-weight: 800; color: var(--accent-blue); width: 40px; }
    .level-info h3 { font-size: 1.1rem; }
    .level-info p { font-size: 0.85rem; color: #8493a8; }
    .btn-video { color: var(--accent-blue); text-decoration: none; font-size: 1.2rem; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Lista Oficial</h2>
  </header>

  <main class="container">
    <div id="levelsContainer">Carregando níveis...</div>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadRanking() {
      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .eq('status', 'approved')
        .order('position', { ascending: true });

      const container = document.getElementById('levelsContainer');
      container.innerHTML = "";

      if (error || !levels || levels.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Nenhum nível aprovado na lista ainda.</p>";
        return;
      }

      levels.forEach(lvl => {
        const card = document.createElement('div');
        card.className = 'level-card';
        card.innerHTML = `
          <div style="display:flex; align-items:center; gap: 15px;">
            <span class="rank-num">#${lvl.position}</span>
            <div class="level-info">
              <h3>${lvl.name}</h3>
              <p>Criado por: <b>${lvl.creator}</b></p>
            </div>
          </div>
          <a href="${lvl.video_url}" target="_blank" class="btn-video"><i class="fa-solid fa-circle-play"></i></a>
        `;
        container.appendChild(card);
      });
    }

    loadRanking();
  </script>
</body>
</html>
