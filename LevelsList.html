<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow List - Demonlist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --bg-color: #0b111e; 
      --card-bg: #131c2e; 
      --card-border: #1d2b45; 
      --text-main: #e2e8f0; 
      --accent-blue: #3b82f6; 
      --text-muted: #8493a8; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    header { width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; }
    h1 { font-size: 1.8rem; }
    .auth-btn { background: var(--accent-blue); color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
    
    .admin-panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; width: 100%; max-width: 700px; margin-bottom: 30px; display: none; }
    .admin-panel h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    input { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; flex: 1; min-width: 140px; }
    
    .list-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; }
    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 15px; }
    .level-rank { font-size: 1.4rem; font-weight: bold; color: var(--accent-blue); min-width: 45px; }
    .level-name { font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-list-ol"></i> Meow List</h1>
    <div id="authActions">
      <a href="CadastroLogin.html" class="auth-btn" id="btnLogin">Entrar</a>
      <button onclick="handleLogout()" class="auth-btn" id="btnLogout" style="display: none; background: #ef4444;">Sair</button>
    </div>
  </header>

  <!-- Painel visível apenas para usuários logados -->
  <div class="admin-panel" id="adminPanel">
    <h3>Adicionar Novo Level</h3>
    <form id="addLevelForm">
      <div class="form-row">
        <input type="text" id="levelName" placeholder="Nome do Level" required>
        <input type="number" id="levelPosition" placeholder="Posição (Ex: 1)" min="1" required>
      </div>
      <button type="submit" class="auth-btn" style="width: 100%;">Adicionar à Demonlist</button>
    </form>
  </div>

  <main class="list-container" id="demonlistContainer">
    <p style="text-align: center; color: var(--text-muted);">Carregando leveis...</p>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Inicialização da página
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
      loadDemonlist();
    });

    // Gerencia exibição de botões e formulário com base na autenticação
    async function checkAuthStatus() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const btnLogin = document.getElementById('btnLogin');
      const btnLogout = document.getElementById('btnLogout');
      const adminPanel = document.getElementById('adminPanel');

      if (session) {
        btnLogin.style.display = 'none';
        btnLogout.style.display = 'inline-block';
        adminPanel.style.display = 'block';
      } else {
        btnLogin.style.display = 'inline-block';
        btnLogout.style.display = 'none';
        adminPanel.style.display = 'none';
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // Carrega a lista do banco em ordem crescente de posição
    async function loadDemonlist() {
      const container = document.getElementById('demonlistContainer');
      
      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .order('position', { ascending: true });

      if (error) {
        container.innerHTML = `<p style="color: #ef4444;">Erro ao carregar a lista: ${error.message}</p>`;
        return;
      }

      if (levels.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhum level cadastrado ainda.</p>';
        return;
      }

      container.innerHTML = '';
      levels.forEach((lvl) => {
        container.innerHTML += `
          <div class="level-card">
            <span class="level-rank">#${lvl.position}</span>
            <span class="level-name">${lvl.name}</span>
          </div>
        `;
      });
    }

    // Adiciona o level e empurra os leveis abaixo para posições inferiores
    document.getElementById('addLevelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('levelName').value.trim();
      const targetPos = parseInt(document.getElementById('levelPosition').value, 10);
      
      if (!name || isNaN(targetPos) || targetPos < 1) return;

      // 1. Seleciona todos os leveis que estão na posição informada ou abaixo dela
      const { data: levelsToShift, error: fetchErr } = await supabaseClient
        .from('levels')
        .select('id, position')
        .gte('position', targetPos);

      if (fetchErr) {
        alert("Erro ao verificar posições existentes: " + fetchErr.message);
        return;
      }

      // 2. Incrementa em +1 a posição de cada um desses leveis
      if (levelsToShift && levelsToShift.length > 0) {
        for (const lvl of levelsToShift) {
          await supabaseClient
            .from('levels')
            .update({ position: lvl.position + 1 })
            .eq('id', lvl.id);
        }
      }

      // 3. Insere o novo level na posição desejada
      const { error: insertErr } = await supabaseClient
        .from('levels')
        .insert([{ name: name, position: targetPos }]);

      if (insertErr) {
        alert("Erro ao inserir level: " + insertErr.message);
      } else {
        document.getElementById('addLevelForm').reset();
        loadDemonlist();
      }
    });
  </script>
</body>
</html>
