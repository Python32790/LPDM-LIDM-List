<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar / Cadastrar - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 400px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    input { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.95rem; width: 100%; }
    input:focus { outline: none; border-color: var(--accent-blue); }
    button { background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    .social-btn { background: #1e293b; border: 1px solid var(--card-border); color: #fff; margin-top: 8px; transition: background 0.2s; }
    .social-btn:hover { background: #2d3d59; }
    .btn-guest { background: transparent; border: 1px dashed var(--card-border); color: var(--text-muted); margin-top: 12px; }
    .btn-guest:hover { color: #fff; border-color: var(--text-muted); background: rgba(255,255,255,0.02); }
    .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 18px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--card-border); }
    .divider span { padding: 0 10px; }
    .toggle-auth { text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    .toggle-auth span { color: var(--accent-blue); font-weight: bold; }
    a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
    a:hover { color: #fff; }
    h2 { font-size: 1.5rem; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2 id="formTitle">Entrar na Meow List</h2>
    
    <form id="authForm" style="margin-top: 15px;">
      <div class="form-group" id="signupUsernameGroup" style="display: none;">
        <label>Nome de Usuário</label>
        <input type="text" id="username" placeholder="Seu nome de usuário">
      </div>

      <div class="form-group" id="loginInputGroup">
        <label>E-mail ou Nome de Usuário</label>
        <input type="text" id="loginInput" required placeholder="seu@email.com ou UsuarioGD">
      </div>

      <div class="form-group" id="signupEmailGroup" style="display: none;">
        <label>E-mail</label>
        <input type="email" id="signupEmail" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" required placeholder="Sua senha">
      </div>

      <button type="submit" id="btnSubmit">Entrar</button>
    </form>

    <div class="divider"><span>OU ENTRE COM</span></div>

    <button type="button" class="social-btn" onclick="loginWithSocial('google')">
      <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continuar com Google
    </button>
    
    <button type="button" class="social-btn" onclick="loginWithSocial('github')">
      <i class="fa-brands fa-github"></i> Continuar com GitHub
    </button>

    <button type="button" class="btn-guest" onclick="continueAsGuest()">
      <i class="fa-solid fa-user-secret"></i> Continuar como Convidado
    </button>

    <div class="toggle-auth" onclick="toggleMode()">
      Não tem uma conta? <span id="toggleText">Cadastre-se</span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('formTitle').textContent = isSignUp ? 'Criar Conta na Meow List' : 'Entrar na Meow List';
      document.getElementById('btnSubmit').textContent = isSignUp ? 'Cadastrar' : 'Entrar';
      document.getElementById('toggleText').textContent = isSignUp ? 'Fazer Login' : 'Cadastre-se';

      const usernameGroup = document.getElementById('signupUsernameGroup');
      const emailGroup = document.getElementById('signupEmailGroup');
      const loginInputGroup = document.getElementById('loginInputGroup');
      const loginInput = document.getElementById('loginInput');
      const signupEmail = document.getElementById('signupEmail');
      const usernameInput = document.getElementById('username');

      if (isSignUp) {
        usernameGroup.style.display = 'flex';
        emailGroup.style.display = 'flex';
        loginInputGroup.style.display = 'none';
        
        loginInput.removeAttribute('required');
        signupEmail.setAttribute('required', 'required');
        usernameInput.setAttribute('required', 'required');
      } else {
        usernameGroup.style.display = 'none';
        emailGroup.style.display = 'none';
        loginInputGroup.style.display = 'flex';

        loginInput.setAttribute('required', 'required');
        signupEmail.removeAttribute('required');
        usernameInput.removeAttribute('required');
      }
    }

    async function loginWithSocial(provider) {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: provider,
        options: {
          redirectTo: window.location.origin + '/Meow-List/index.html'
        }
      });
      if (error) alert("Erro ao conectar com " + provider + ": " + error.message);
    }

    function continueAsGuest() {
      supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.textContent = "Processando...";

      if (isSignUp) {
        const email = document.getElementById('signupEmail').value.trim();
        const username = document.getElementById('username').value.trim();

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { username: username }
          }
        });

        if (error) {
          alert("Erro no cadastro: " + error.message);
        } else {
          if (data.user) {
            await supabaseClient.from('profiles').upsert({
              id: data.user.id,
              username: username,
              email: email
            });
          }
          alert("Conta criada com sucesso! Você já pode fazer login.");
          toggleMode();
        }
      } else {
        const loginVal = document.getElementById('loginInput').value.trim();
        let targetEmail = loginVal;

        // Se a entrada não for um e-mail, busca o e-mail na tabela de perfis
        if (!loginVal.includes('@')) {
          const { data: profile, error: profileErr } = await supabaseClient
            .from('profiles')
            .select('email')
            .ilike('username', loginVal)
            .single();

          if (profileErr || !profile || !profile.email) {
            alert("Nome de usuário não encontrado ou sem e-mail vinculado.");
            btn.disabled = false;
            btn.textContent = 'Entrar';
            return;
          }

          targetEmail = profile.email;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
          email: targetEmail, 
          password 
        });

        if (error) {
          alert("Erro ao entrar: Verifique suas credenciais e tente novamente.");
        } else {
          alert("Login realizado com sucesso!");
          window.location.href = "index.html";
        }
      }
      btn.disabled = false;
      btn.textContent = isSignUp ? 'Cadastrar' : 'Entrar';
    });
  </script>
</body>
</html>
