<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Record - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 450px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    input, select { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.95rem; width: 100%; }
    input:focus, select:focus { outline: none; border-color: var(--accent-blue); }
    button { background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background: #2563eb; }
    a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
    a:hover { color: #fff; }
    h2 { font-size: 1.5rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2><i class="fa-solid fa-trophy" style="color: #eab308;"></i> Enviar Record / Completion</h2>

    <form id="recordForm">
      <div class="form-group">
        <label for="levelSelect">Selecione o Nível da Lista</label>
        <select id="levelSelect" required>
          <option value="" disabled selected>Carregando níveis...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="playerName">Nome do Jogador no GD</label>
        <input type="text" id="playerName" placeholder="Ex: ItsMeTennaGD" required>
      </div>

      <div class="form-group">
        <label for="progress">Porcentagem / Progressão (%)</label>
        <input type="number" id="progress" min="1" max="100" placeholder="Ex: 100" required>
      </div>

      <div class="form-group">
        <label for="videoUrl">Link do Vídeo de Prova</label>
        <input type="url" id="videoUrl" placeholder="https://youtube.com/... ou https://medal.tv/..." required>
      </div>

      <button type="submit" id="btnSubmit"><i class="fa-solid fa-paper-plane"></i> Enviar Record</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let loggedUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      await loadApprovedLevels();
    });

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        loggedUserId = session.user.id;
      }
    }

    async function loadApprovedLevels() {
      const select = document.getElementById('levelSelect');
      
      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('id, name, creator')
        .eq('meow_status', 'approved')
        .order('position', { ascending: true });

      if (error || !levels || levels.length === 0) {
        select.innerHTML = '<option value="" disabled selected>Nenhum nível aprovado encontrado</option>';
        return;
      }

      select.innerHTML = '<option value="" disabled selected>Selecione um nível...</option>';
      levels.forEach(lvl => {
        const option = document.createElement('option');
        option.value = lvl.id;
        option.textContent = `${lvl.name} por ${lvl.creator}`;
        select.appendChild(option);
      });
    }

    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      
      const selectedLevelId = document.getElementById('levelSelect').value;
      const inputPlayerName = document.getElementById('playerName').value.trim();
      const inputProgress = parseInt(document.getElementById('progress').value, 10);
      const inputVideoUrl = document.getElementById('videoUrl').value.trim();

      if (!selectedLevelId) {
        alert("Por favor, selecione um nível válido.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando record...";

      const payload = {
        level_id: selectedLevelId,
        player_name: inputPlayerName,
        progress: inputProgress,
        video_url: inputVideoUrl,
        submitted_by: loggedUserId
      };

      const { error } = await supabaseClient
        .from('records')
        .insert([payload]);

      if (error) {
        alert("Erro ao enviar: " + error.message);
      } else {
        alert("Record enviado com sucesso! Ele aparecerá na lista assim que for aprovado pela moderação.");
        document.getElementById('recordForm').reset();
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Record';
    });
  </script>
</body>
</html>
