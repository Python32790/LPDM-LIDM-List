<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderação de Records - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; --green: #22c55e; --red: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 800px; }
    h1 { margin-bottom: 20px; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
    .record-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
    .record-info h3 { font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
    .record-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 4px; }
    .record-info a { color: var(--accent-blue); text-decoration: none; word-break: break-all; }
    .actions { display: flex; gap: 10px; }
    .btn { border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 6px; }
    .btn-approve { background-color: var(--green); }
    .btn-approve:hover { background-color: #16a34a; }
    .btn-reject { background-color: var(--red); }
    .btn-reject:hover { background-color: #dc2626; }
    .empty-msg { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fa-solid fa-user-shield" style="color: #3b82f6;"></i> Moderação de Records</h1>
    <div id="recordsList">
      <p class="empty-msg">Carregando pendências...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', loadPendingRecords);

    async function loadPendingRecords() {
      const container = document.getElementById('recordsList');
      
      const { data: records, error } = await supabaseClient
        .from('records')
        .select('id, player_name, progress, video_url, levels(name)')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      if (error) {
        container.innerHTML = `<p class="empty-msg">Erro ao carregar: ${error.message}</p>`;
        return;
      }

      if (!records || records.length === 0) {
        container.innerHTML = '<p class="empty-msg">Nenhum record pendente no momento!</p>';
        return;
      }

      container.innerHTML = '';
      records.forEach(rec => {
        const levelName = rec.levels ? rec.levels.name : 'Nível Desconhecido';
        
        const card = document.createElement('div');
        card.className = 'record-card';
        card.id = `record-${rec.id}`;
        card.innerHTML = `
          <div class="record-info">
            <h3>${rec.player_name} - ${rec.progress}% em ${levelName}</h3>
            <p><strong>Vídeo:</strong> <a href="${rec.video_url}" target="_blank">${rec.video_url}</a></p>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-approve" onclick="atualizarStatus(event, '${rec.id}', 'approved')">
              <i class="fa-solid fa-check"></i> Aprovar
            </button>
            <button type="button" class="btn btn-reject" onclick="atualizarStatus(event, '${rec.id}', 'rejected')">
              <i class="fa-solid fa-xmark"></i> Rejeitar
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function atualizarStatus(event, recordId, novoStatus) {
      if (event) event.preventDefault();

      const btn = event.currentTarget;
      btn.disabled = true;

      const { error } = await supabaseClient
        .from('records')
        .update({ status: novoStatus })
        .eq('id', recordId);

      if (error) {
        alert("Erro ao atualizar o record: " + error.message);
        btn.disabled = false;
      } else {
        // Remove o card da tela de forma suave sem precisar recarregar a página inteira
        const cardElement = document.getElementById(`record-${recordId}`);
        if (cardElement) cardElement.remove();

        const remaining = document.querySelectorAll('.record-card');
        if (remaining.length === 0) {
          document.getElementById('recordsList').innerHTML = '<p class="empty-msg">Nenhum record pendente no momento!</p>';
        }
      }
    }
  </script>
</body>
</html>
