<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPDM/LIDM List - Aprovar Níveis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0b111e;
      --card-bg: #131c2e;
      --card-border: #1d2b45;
      --text-main: #e2e8f0;
      --text-muted: #8493a8;
      --accent-blue: #3b82f6;
      --success-green: #22c55e;
      --danger-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
    .navbar { width: 100%; background-color: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-radius: 8px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; text-decoration: none; color: var(--text-main); }
    .container { max-width: 800px; margin: 0 auto; }
    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .level-header h3 { font-size: 1.2rem; }
    .level-header p { color: var(--text-muted); font-size: 0.9rem; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    input[type="number"] { width: 100px; padding: 8px; background: #0b111e; border: 1px solid var(--card-border); color: #fff; border-radius: 6px; outline: none; }
    button { padding: 9px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-approve { background: var(--success-green); color: white; }
    .btn-reject { background: var(--danger-red); color: white; }
    .denied-box { text-align: center; background: var(--card-bg); border: 1px solid var(--card-border); padding: 40px; border-radius: 12px; }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Painel de Moderação</h2>
  </header>

  <main class="container">
    <div id="accessDenied" class="denied-box" style="display: none;">
      <h2 style="color: var(--danger-red);"><i class="fa-solid fa-lock"></i> Acesso Restrito</h2>
      <p style="margin-top: 10px; color: var(--text-muted);">Esta área é exclusiva para moderadores e administradores da lista.</p>
    </div>

    <div id="modContent">
      <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-clock-history"></i> Níveis Pendentes de Aprovação</h3>
      <div id="pendingList">Carregando solicitações...</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkPermission() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        window.location.href = "CadastroLogin.html";
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || (profile.role !== 'mod' && profile.role !== 'admin')) {
        document.getElementById('modContent').style.display = 'none';
        document.getElementById('accessDenied').style.display = 'block';
        return;
      }

      loadPendingLevels();
    }

    async function loadPendingLevels() {
      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: true });

      const container = document.getElementById('pendingList');
      container.innerHTML = "";

      if (error || !levels || levels.length === 0) {
        container.innerHTML = "<p style='color: var(--text-muted);'>Nenhum nível pendente de avaliação no momento.</p>";
        return;
      }

      levels.forEach(lvl => {
        const card = document.createElement('div');
        card.className = 'level-card';
        card.innerHTML = `
          <div class="level-header">
            <h3>${lvl.name}</h3>
            <p>Criador: <b>${lvl.creator}</b></p>
            <p style="margin-top: 4px;"><a href="${lvl.video_url}" target="_blank" style="color: var(--accent-blue); text-decoration: none;"><i class="fa-solid fa-play"></i> Assistir Vídeo de Prova</a></p>
          </div>
          <div class="actions">
            <label>Posição no Ranking:</label>
            <input type="number" id="pos-${lvl.id}" placeholder="Ex: 1" min="1">
            <button class="btn-approve" onclick="approveLevel('${lvl.id}')"><i class="fa-solid fa-check"></i> Aprovar</button>
            <button class="btn-reject" onclick="rejectLevel('${lvl.id}')"><i class="fa-solid fa-xmark"></i> Rejeitar</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function approveLevel(id) {
      const posInput = document.getElementById(`pos-${id}`).value;
      if (!posInput || posInput < 1) {
        alert("Por favor, digite a posição exata em que o nível deve ficar na lista.");
        return;
      }

      const { error } = await supabaseClient
        .from('levels')
        .update({ status: 'approved', position: parseInt(posInput) })
        .eq('id', id);

      if (error) {
        alert("Erro ao aprovar o nível: " + error.message);
      } else {
        alert("Nível aprovado e inserido no ranking com sucesso!");
        loadPendingLevels();
      }
    }

    async function rejectLevel(id) {
      if (!confirm("Tem certeza que deseja rejeitar este nível?")) return;

      const { error } = await supabaseClient
        .from('levels')
        .update({ status: 'rejected' })
        .eq('id', id);

      if (error) {
        alert("Erro ao rejeitar o nível: " + error.message);
      } else {
        alert("Nível rejeitado.");
        loadPendingLevels();
      }
    }

    checkPermission();
  </script>
</body>
</html>
